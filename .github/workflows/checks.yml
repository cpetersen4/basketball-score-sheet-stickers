name: Windows checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install developer checks
        run: python -m pip install -r tools/requirements.txt bandit pip-audit
      - name: Test PDF generation and navigation
        run: python -m unittest discover -s tests -v
      - name: Scan medium and high severity code issues
        run: python -m bandit -r app -ll
      - name: Audit dependencies
        run: python -m pip_audit -r tools/requirements.txt
      - name: Build the portable Windows package
        shell: pwsh
        run: ./tools/build-windows.ps1
      - name: Verify standalone package
        run: python tools/verify_windows_package.py
